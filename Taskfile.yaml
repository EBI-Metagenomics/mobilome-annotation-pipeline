version: "3"

vars:
 VENV_DIR: .venv

tasks:
 # Setup Python virtual environment using uv
 setup-venv:
  desc: "Bootstrap Python virtual environment with uv and install dependencies"
  status:
    - test -d {{.VENV_DIR}}
  cmds:
    - uv venv {{.VENV_DIR}}
    - uv pip install -e .
  silent: true

 # Pytest tasks
 test:
   desc: "Run all tests with pytest"
   deps: [setup-venv]
   cmds:
     - uv run pytest

 test-verbose:
   desc: "Run tests with verbose output"
   deps: [setup-venv]
   cmds:
     - uv run pytest -v

 test-coverage:
   desc: "Run tests with coverage report"
   deps: [setup-venv]
   cmds:
     - uv run pytest --cov --cov-report=html

 test-specific:
   desc: "Run specific test file or pattern, use: task test-specific -- <test_pattern>"
   deps: [setup-venv]
   cmds:
     - uv run pytest {{.CLI_ARGS}}
   interactive: true

 # Fetch the full ICEfinder2-lite test databases (replaces the old committed mini-DB).
 # Same 61 MB tarball the production DB_DOWNLOAD_MOBILOME_DBS module uses, hosted on the EBI FTP.
 # Required by the nf-test positive test before `nf-test test`.
 fetch-icefinder-test-db:
   desc: "Download + extract the ICEfinder2-lite DBs needed by the nf-test positive test"
   vars:
     ICF2_DIR: tests/reference_databases/icefinder
     ICF2_URL: ftp://ftp.ebi.ac.uk/pub/databases/metagenomics/pipelines/tool-dbs/icefinder2lite/icf2_dbs.tar.gz
   status:
     - test -d {{.ICF2_DIR}}/icf2_dbs/macsydata
   cmds:
     - wget -q -O {{.ICF2_DIR}}/icf2_dbs.tar.gz {{.ICF2_URL}}
     - tar -xzf {{.ICF2_DIR}}/icf2_dbs.tar.gz -C {{.ICF2_DIR}}
     - rm -f {{.ICF2_DIR}}/icf2_dbs.tar.gz
   silent: true

 # Utility tasks
 clean:
   desc: "Clean up virtual environment"
   prompt: "This will destroy your virtual env, okay?"
   cmds:
     - rm -rf {{.VENV_DIR}}